name: Feature request
description: Suggest an improvement or a new capability.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Frame the request in terms of the problem you're trying to solve.
        Implementation is part of the discussion — propose one, but be
        open to alternatives.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the feature look like? Be concrete — example CLI invocations, sample output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
