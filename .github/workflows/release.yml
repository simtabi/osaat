name: Release

# Every release is tag-driven and publishes BOTH the source code and the
# binaries: GoReleaser cross-compiles the full matrix, builds the archives,
# packages, and a reproducible source tarball, generates SBOMs and checksums,
# creates the GitHub Release (body from the tagged CHANGELOG section), and
# updates the Homebrew/Scoop/Winget manifests. A build-provenance attestation is
# then signed for every artifact via the checksums file.
on:
  push:
    tags: ["v*.*.*"]

# Releases must never be cancelled mid-publish by a newer tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    # Linux cross-compiles every target (pure Go) and builds the native
    # deb/rpm/apk packages, so one ubuntu runner produces the full matrix.
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      # Whether both deploy keys are set, never the keys: secrets cannot be read in a step's `if`.
      USE_DEPLOY_KEYS: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' && secrets.SCOOP_BUCKET_DEPLOY_KEY != '' }}
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing for the provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for GoReleaser

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # syft powers GoReleaser's SBOM generation.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Extract CHANGELOG section for this tag
        # Written outside the checkout: GoReleaser refuses to release from a dirty tree,
        # and an untracked release_notes.md in the repo root is exactly that (the
        # v0.1.0 tag failed on it). A snapshot build skips that check, so it never showed.
        run: ./scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release_notes.md"

      # The Homebrew tap and Scoop bucket only accept changes through a pull
      # request, so GoReleaser pushes a branch there and opens one. GITHUB_TOKEN
      # is scoped to this repository and cannot do that, and a PAT would be a
      # long-lived credential; Refresh Bot mints a token for this run only,
      # limited to the two package repositories. Both values are org-level.
      # Not minted once both deploy keys are set: GoReleaser then pushes with the keys, and the
      # step's output is simply empty.
      - name: Mint a package-repository token
        id: tap
        if: env.USE_DEPLOY_KEYS != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: simtabi
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
          permission-pull-requests: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap.outputs.token }}
          # Write deploy keys on simtabi/homebrew-tap and simtabi/scoop-bucket. When set, GoReleaser
          # pushes with them and the token is not used for those two.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          # Scoop/Winget publishing is skipped until the bucket/fork exist. Set
          # repo variable SKIP_WINDOWS_PKGS to "false" to enable it.
          SKIP_WINDOWS_PKGS: ${{ vars.SKIP_WINDOWS_PKGS || 'true' }}
          # Scoop's own switch; empty falls back to SKIP_WINDOWS_PKGS (see the GoReleaser config).
          SKIP_SCOOP: ${{ vars.SKIP_SCOOP }}

      # Sign a build-provenance attestation for every released artifact. The
      # checksums file lists them all, so `gh attestation verify <file>
      # --repo <owner>/<repo>` works for any downloaded binary or archive.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/dist/checksums.txt
