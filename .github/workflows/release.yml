name: Release

# Every release is tag-driven and publishes BOTH the source code and the
# binaries: GoReleaser cross-compiles the full matrix, builds the archives,
# packages, and a reproducible source tarball, generates SBOMs and checksums,
# creates the GitHub Release (body from the tagged CHANGELOG section), and
# updates the Homebrew/Scoop/Winget manifests. A build-provenance attestation is
# then signed for every artifact via the checksums file.
#
# Go releases are git only until the owner says otherwise for this project, so
# nothing here starts on a tag push: pushing a vX.Y.Z tag records a version and
# publishes nothing. A release is dispatched by hand against the tag, with an
# explicit confirmation, and refuses to run without both:
#
#   gh workflow run release.yml --repo simtabi/osaat --ref vX.Y.Z -f confirm=release-go
#
# It stays tag-driven: GoReleaser reads the version from the ref it is run
# against, and the first step refuses a ref that is not a v[0-9]* tag.
# src/cmd/osaat's TestReleaseRunsOnlyOnAConfirmedDispatch and
# src/internal/release's TestReleaseRefusesFirst fail if an automatic trigger
# comes back or the refusal stops being the first step.
#
# The module lives in src/: GoReleaser runs from the repository root with
# --config src/.goreleaser.yaml and writes into .cache/goreleaser/, never into
# build/.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type release-go to publish binaries for the tag this run is dispatched on
        required: true
        type: string

# Releases must never be cancelled mid-publish by a newer tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    # Linux cross-compiles every target (pure Go) and builds the native
    # deb/rpm/apk packages, so one ubuntu runner produces the full matrix.
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      # Whether both deploy keys are set, never the keys: secrets cannot be read in a step's `if`.
      USE_DEPLOY_KEYS: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' && secrets.SCOOP_BUCKET_DEPLOY_KEY != '' }}
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing for the provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - name: Refuse without confirmation or a release tag
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "release-go" ]; then
            echo "::error::confirm must be release-go; nothing was published"
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/v[0-9]*) ;;
            *) echo "::error::dispatch this on a vX.Y.Z tag (--ref vX.Y.Z), not ${GITHUB_REF}"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for GoReleaser

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # syft powers GoReleaser's SBOM generation.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # A Go build of this module needs a tag named after its subdirectory: the
      # module is github.com/simtabi/osaat/src, so Go resolves src/vX.Y.Z and
      # ignores vX.Y.Z. OSS GoReleaser rejects the prefixed tag as non-semver,
      # so the release runs off vX.Y.Z and mirrors src/vX.Y.Z onto the same
      # commit here, where it cannot be forgotten. This workflow starts on no
      # tag push, so pushing src/... starts no second run. A re-run finds the
      # tag already there and leaves it alone: a public tag is never moved.
      - name: Mirror the tag Go resolves the module through
        run: |
          alias_tag="src/${GITHUB_REF_NAME}"
          if git rev-parse -q --verify "refs/tags/${alias_tag}" >/dev/null; then
            echo "${alias_tag} already exists"
          else
            git tag "${alias_tag}" "${GITHUB_REF_NAME}^{commit}"
            git push origin "refs/tags/${alias_tag}"
            echo "pushed ${alias_tag}"
          fi

      - name: Extract CHANGELOG section for this tag
        # Written outside the checkout: GoReleaser refuses to release from a dirty tree,
        # and an untracked release_notes.md in the repo root is exactly that (the
        # v0.1.0 tag failed on it). A snapshot build skips that check, so it never showed.
        run: ./src/scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release_notes.md"

      # The Homebrew tap and Scoop bucket only accept changes through a pull
      # request, so GoReleaser pushes a branch there and opens one. GITHUB_TOKEN
      # is scoped to this repository and cannot do that, and a PAT would be a
      # long-lived credential; Refresh Bot mints a token for this run only,
      # limited to the two package repositories. Both values are org-level.
      # Not minted once both deploy keys are set: GoReleaser then pushes with the keys, and the
      # step's output is simply empty.
      - name: Mint a package-repository token
        id: tap
        if: env.USE_DEPLOY_KEYS != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: simtabi
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
          permission-pull-requests: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --config src/.goreleaser.yaml --release-notes=${{ runner.temp }}/release_notes.md
        env:
          # Two tags now sit on this commit (vX.Y.Z and src/vX.Y.Z); name the one
          # GoReleaser releases so it never reads the version from the alias.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap.outputs.token }}
          # Write deploy keys on simtabi/homebrew-tap and simtabi/scoop-bucket. When set, GoReleaser
          # pushes with them and the token is not used for those two.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          # Scoop/Winget publishing is skipped until the bucket/fork exist. Set
          # repo variable SKIP_WINDOWS_PKGS to "false" to enable it.
          SKIP_WINDOWS_PKGS: ${{ vars.SKIP_WINDOWS_PKGS || 'true' }}
          # Scoop's own switch; empty falls back to SKIP_WINDOWS_PKGS (see the GoReleaser config).
          SKIP_SCOOP: ${{ vars.SKIP_SCOOP }}

      # Sign a build-provenance attestation for every released artifact. The
      # checksums file lists them all, so `gh attestation verify <file>
      # --repo <owner>/<repo>` works for any downloaded binary or archive.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: .cache/goreleaser/checksums.txt
