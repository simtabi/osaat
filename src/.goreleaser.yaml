version: 2
project_name: osaat

# Run from the repository root: goreleaser ... --config src/.goreleaser.yaml.
# The module lives in src/ (builds[].dir), and the archive files (LICENSE,
# README.md, CHANGELOG.md) are read from the root, which a run from inside src/
# cannot reach.
#
# GoReleaser writes into a scratch dist, .cache/goreleaser/ (gitignored), never
# into build/. build/ holds one folder per OS and nothing else; `make cross` and
# `make dist` write it with src/scripts/build-all.sh. A release (simtabi/.github's
# go-release.yml) uploads straight from this dist, so release assets stay flat.
dist: .cache/goreleaser

before:
  hooks:
    - go -C src mod tidy

# One pure-Go binary cross-compiled to the full OS/arch matrix. CGO is disabled
# so every target is a static, portable binary; -trimpath makes builds
# reproducible and -s -w strips debug info for smaller artifacts.
builds:
  - id: osaat
    dir: src
    main: ./cmd/osaat
    binary: osaat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64 # 64-bit x86
      - arm64 # 64-bit ARM (Apple silicon, Graviton, RPi 64-bit)
      - "386" # 32-bit x86
      - arm # 32-bit ARM (RPi, etc.)
    goarm:
      - "7"
    # Skip tuples Go does not support or where the user base is
    # effectively zero. Darwin dropped 32-bit support; Windows/FreeBSD
    # 32-bit ARM never had meaningful adoption for desktop tools.
    ignore:
      - { goos: darwin, goarch: "386" }
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/simtabi/osaat/src/internal/version.Version={{ .Version }}
      - -X github.com/simtabi/osaat/src/internal/version.Commit={{ .Commit }}
      - -X github.com/simtabi/osaat/src/internal/version.Date={{ .CommitDate }}

# A single macOS universal binary (amd64 + arm64) alongside the per-arch ones.
universal_binaries:
  - id: osaat
    ids: [osaat]
    name_template: osaat
    replace: false

# All artifacts use one flat, versionless, Go-style naming scheme:
#   osaat_<os>_<arch>[.ext]  with darwin → macos, e.g.
#   osaat_macos_arm64, osaat_linux_amd64, osaat_windows_386.exe,
#   osaat_macos_universal, osaat_linux_armv7, osaat_freebsd_amd64.
# The release tag carries the version. install scripts reconstruct these names.
archives:
  - id: binary
    ids: [osaat]
    formats: [binary]
    name_template: &name >-
      osaat_{{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal{{ else if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}

  - id: archive
    ids: [osaat]
    name_template: *name
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Native Linux packages (nfpm operates on the Linux builds only).
nfpms:
  - id: osaat
    ids: [osaat]
    package_name: osaat
    vendor: Simtabi LLC
    homepage: "https://opensource.simtabi.com/products/simtabi/osaat"
    maintainer: "Imani Manyara <imani@simtabi.com>"
    description: "Audit and back up installed applications on macOS, Linux, and Unix."
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    file_name_template: 'osaat_linux_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Reproducible source tarball, uploaded as a first-class release asset next to
# GitHub's auto-generated "Source code" links, so every release ships the exact
# code as well as the binaries.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# One SBOM per archive (syft, SPDX-JSON), attached as release assets so
# consumers can audit the supply chain of what they download.
sboms:
  - id: archive
    artifacts: archive

snapshot:
  version_template: "{{ .Version }}-snapshot+{{ .ShortCommit }}"

# The GitHub release is the only channel (owner, 2026-11-13): no homebrew_casks, scoops, winget
# or any other publishing block. The simtabi/homebrew-tap cask and simtabi/scoop-bucket manifest
# published for earlier versions are frozen: no longer updated, still there. simtabi/.github's
# go-release.yml refuses this config if one of those blocks comes back, and
# src/internal/release's TestGoReleaserPublishesNowhereElse fails first.

release:
  github:
    owner: simtabi
    name: osaat
  draft: false
  prerelease: auto

# The release body comes from CHANGELOG.md via --release-notes (see release.yml).
# Do NOT set `disable: true` here: GoReleaser documents that it also ignores the
# --release-notes file and renders an empty body, which is what v0.1.1 shipped with.
# With --release-notes given, GoReleaser uses that file and generates nothing itself.
changelog:
  use: git
