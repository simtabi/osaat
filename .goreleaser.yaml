version: 2

project_name: osaat

before:
  hooks:
    - go mod tidy

builds:
  - id: osaat
    main: ./cmd/osaat
    binary: osaat
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/simtabi/osaat/internal/version.Version={{.Version}}
      - -X github.com/simtabi/osaat/internal/version.Commit={{.Commit}}
      - -X github.com/simtabi/osaat/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: "osaat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  github:
    owner: simtabi
    name: osaat

